services:
  strelingo:
    build: .
    container_name: strelingo-smart
    restart: unless-stopped
    ports:
      - "7000:7000"
    environment:
      # Public address the player reaches the add-on at (needed behind a reverse proxy).
      - EXTERNAL_URL=${EXTERNAL_URL:-}
      # Signs the 🎓 /play links. Set a long random string, or one is generated into /data.
      - SECRET=${SECRET:-}
      - ADDON_NAME=${ADDON_NAME:-}
    volumes:
      - strelingo_data:/data

volumes:
  strelingo_data:
